<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950"
     width="145mm" height="114.79mm">
  <title>Consolidated Fulfilment</title>
  <desc>Many Shipments, Many Consignments. Two independent supplier-buyer shipment
  contracts are carried as consignments that one forwarder consolidates and another
  de-consolidates. Original artwork created for OASIS UBL; contains no third-party
  material.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="4" markerHeight="4" orient="auto-start-reverse"
            markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#1a1a1a"/>
    </marker>

    <symbol id="ic-supplier" viewBox="0 0 190 150">
      <g fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round">
        <rect x="28" y="8" width="18" height="36" fill="#c8c8c8"/>
        <path d="M18 62 L18 38 L69 62 L69 38 L120 62 L120 38 L171 62 Z" fill="#c8c8c8"/>
        <rect x="18" y="62" width="154" height="76" fill="#e8e8e8"/>
        <rect x="30" y="76" width="24" height="18" fill="#ffffff"/>
        <rect x="136" y="76" width="24" height="18" fill="#ffffff"/>
        <rect x="66" y="88" width="58" height="50" fill="#ffffff"/>
        <g stroke-width="3">
          <line x1="66" y1="104" x2="124" y2="104"/>
          <line x1="66" y1="120" x2="124" y2="120"/>
        </g>
      </g>
    </symbol>

    <symbol id="ic-supplier-b" viewBox="0 0 190 150">
      <g fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round">
        <path d="M24 138 V44 A20 20 0 0 1 64 44 V138 Z" fill="#c8c8c8"/>
        <line x1="24" y1="74" x2="64" y2="74"/>
        <line x1="24" y1="104" x2="64" y2="104"/>
        <path d="M72 138 V62 A16 16 0 0 1 104 62 V138 Z" fill="#e8e8e8"/>
        <line x1="72" y1="90" x2="104" y2="90"/>
        <path d="M106 86 L143 62 L180 86 Z" fill="#c8c8c8"/>
        <rect x="112" y="86" width="62" height="52" fill="#e8e8e8"/>
        <rect x="132" y="108" width="24" height="30" fill="#ffffff"/>
      </g>
    </symbol>

    <symbol id="ic-buyer" viewBox="0 0 180 150">
      <g fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round">
        <rect x="18" y="26" width="144" height="18" fill="#c8c8c8"/>
        <rect x="28" y="44" width="124" height="94" fill="#e8e8e8"/>
        <rect x="44" y="52" width="26" height="16" fill="#ffffff"/>
        <rect x="110" y="52" width="26" height="16" fill="#ffffff"/>
        <path d="M34 74 L146 74 L134 98 L46 98 Z" fill="#9a9a9a"/>
        <rect x="64" y="100" width="52" height="38" fill="#ffffff"/>
      </g>
    </symbol>

    <symbol id="ic-buyer-b" viewBox="0 0 180 150">
      <g fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round">
        <rect x="36" y="12" width="108" height="12" fill="#c8c8c8"/>
        <rect x="44" y="24" width="92" height="114" fill="#e8e8e8"/>
        <g fill="#ffffff">
          <rect x="58" y="36" width="24" height="18"/>
          <rect x="100" y="36" width="24" height="18"/>
          <rect x="58" y="62" width="24" height="18"/>
          <rect x="100" y="62" width="24" height="18"/>
        </g>
        <rect x="76" y="100" width="30" height="38" fill="#ffffff"/>
      </g>
    </symbol>

    <symbol id="ic-forwarder" viewBox="0 0 210 140">
      <g fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round">
        <rect x="10" y="28" width="112" height="66" fill="#e8e8e8"/>
        <path d="M122 46 L156 46 L182 76 L182 94 L122 94 Z" fill="#c8c8c8"/>
        <rect x="130" y="52" width="28" height="20" fill="#ffffff"/>
        <line x1="10" y1="94" x2="182" y2="94"/>
        <circle cx="46" cy="102" r="17" fill="#ffffff"/>
        <circle cx="156" cy="102" r="17" fill="#ffffff"/>
      </g>
    </symbol>

    <symbol id="ic-document" viewBox="0 0 130 160">
      <g fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round">
        <path d="M12 10 H86 L118 42 V150 H12 Z" fill="#ffffff"/>
        <path d="M86 10 V42 H118" fill="#e8e8e8"/>
        <g stroke-linecap="round">
          <line x1="30" y1="66" x2="100" y2="66"/>
          <line x1="30" y1="86" x2="100" y2="86"/>
          <line x1="30" y1="106" x2="100" y2="106"/>
          <line x1="30" y1="126" x2="74" y2="126"/>
        </g>
      </g>
    </symbol>

    <symbol id="ic-goods" viewBox="0 0 210 172">
      <g fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round">
        <rect x="26" y="18" width="76" height="52" fill="#e8e8e8"/>
        <rect x="106" y="18" width="76" height="52" fill="#e8e8e8"/>
        <rect x="26" y="70" width="76" height="52" fill="#e8e8e8"/>
        <rect x="106" y="70" width="76" height="52" fill="#e8e8e8"/>
        <line x1="64" y1="18" x2="64" y2="70"/>
        <line x1="64" y1="70" x2="64" y2="122"/>
        <line x1="144" y1="70" x2="144" y2="122"/>
        <rect x="122" y="32" width="44" height="24" fill="#ffffff"/>
        <rect x="12" y="124" width="184" height="12" fill="#c8c8c8"/>
        <rect x="22" y="136" width="28" height="16" fill="#c8c8c8"/>
        <rect x="90" y="136" width="28" height="16" fill="#c8c8c8"/>
        <rect x="158" y="136" width="28" height="16" fill="#c8c8c8"/>
        <rect x="12" y="152" width="184" height="10" fill="#9a9a9a"/>
      </g>
    </symbol>

    <symbol id="ic-parcel" viewBox="0 0 150 136">
      <g fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round">
        <rect x="16" y="28" width="118" height="80" fill="#e8e8e8"/>
        <line x1="54" y1="28" x2="54" y2="108"/>
        <rect x="86" y="74" width="36" height="22" fill="#ffffff"/>
      </g>
    </symbol>
  </defs>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
    <rect x="0" y="0" width="1200" height="950" fill="#ffffff"/>
    <rect x="5" y="5" width="1190" height="940" fill="none" stroke="#1a1a1a" stroke-width="10"/>

    <text x="600" y="74" font-size="46" text-anchor="middle">Consolidated Fulfilment</text>
    <text x="600" y="116" font-size="26" text-anchor="middle">Many Shipments — Many Consignments</text>

    <!-- shipment contracts: supplier to buyer, independent of how the goods move -->
    <line x1="230" y1="240" x2="985" y2="240" stroke="#1a1a1a" stroke-width="8"
          stroke-dasharray="16 14" marker-end="url(#arrowhead)"/>
    <line x1="230" y1="745" x2="985" y2="745" stroke="#1a1a1a" stroke-width="8"
          stroke-dasharray="16 14" marker-end="url(#arrowhead)"/>

    <!-- consignments: in to forwarder A, consolidated across, out from forwarder B -->
    <g stroke="#1a1a1a" stroke-width="10" fill="none">
      <line x1="200" y1="300" x2="270" y2="412" marker-end="url(#arrowhead)"/>
      <line x1="200" y1="668" x2="270" y2="548" marker-end="url(#arrowhead)"/>
      <line x1="930" y1="412" x2="1000" y2="300" marker-end="url(#arrowhead)"/>
      <line x1="930" y1="548" x2="1000" y2="660" marker-end="url(#arrowhead)"/>
    </g>
    <line x1="440" y1="470" x2="758" y2="470" stroke="#1a1a1a" stroke-width="11"
          marker-end="url(#arrowhead)"/>

    <use href="#ic-supplier"   x="60"   y="165" width="150" height="118"/>
    <use href="#ic-supplier-b" x="60"   y="680" width="150" height="118"/>
    <use href="#ic-buyer"      x="1000" y="165" width="145" height="121"/>
    <use href="#ic-buyer-b"    x="1000" y="680" width="145" height="121"/>
    <use href="#ic-forwarder"  x="250"  y="420" width="180" height="120"/>
    <use href="#ic-forwarder"  x="770"  y="420" width="180" height="120"/>
    <use href="#ic-document"   x="730"  y="140" width="73"  height="90"/>
    <use href="#ic-document"   x="730"  y="645" width="73"  height="90"/>
    <use href="#ic-goods"      x="525"  y="600" width="150" height="123"/>
    <use href="#ic-parcel"     x="290"  y="330" width="90"  height="82"/>
    <use href="#ic-parcel"     x="290"  y="610" width="90"  height="82"/>
    <use href="#ic-parcel"     x="820"  y="330" width="90"  height="82"/>
    <use href="#ic-parcel"     x="820"  y="610" width="90"  height="82"/>

    <g stroke="#1a1a1a" stroke-width="4">
      <rect x="460" y="217" width="200" height="46" fill="#e8e8e8" stroke-dasharray="9 7"/>
      <rect x="460" y="722" width="200" height="46" fill="#e8e8e8" stroke-dasharray="9 7"/>
      <rect x="475" y="447" width="250" height="46" fill="#e8e8e8"/>
      <rect x="30"  y="349" width="200" height="42" fill="#e8e8e8"/>
      <rect x="30"  y="609" width="200" height="42" fill="#e8e8e8"/>
      <rect x="970" y="349" width="200" height="42" fill="#e8e8e8"/>
      <rect x="970" y="609" width="200" height="42" fill="#e8e8e8"/>
    </g>
    <g font-size="26" text-anchor="middle">
      <text x="560" y="250">SHIPMENT</text>
      <text x="560" y="755">SHIPMENT</text>
      <text x="600" y="480">CONSIGNMENT</text>
    </g>
    <g font-size="22" text-anchor="middle">
      <text x="130"  y="378">CONSIGNMENT</text>
      <text x="130"  y="638">CONSIGNMENT</text>
      <text x="1070" y="378">CONSIGNMENT</text>
      <text x="1070" y="638">CONSIGNMENT</text>
    </g>

    <g font-size="25" text-anchor="middle">
      <text x="135"  y="320">Supplier A</text>
      <text x="135"  y="836">Supplier B</text>
      <text x="1072" y="320">Buyer A</text>
      <text x="1072" y="836">Buyer B</text>
      <text x="340"  y="580">Forwarder A</text>
      <text x="860"  y="580">Forwarder B</text>
    </g>
  </g>
</svg>
